<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablette Maître du Jeu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div id="main-dashboard" class="dashboard-container">
        <div class="header-info">
            <h2 id="compteur-q">Questions : -- / --</h2>
            <div id="preview-q">En attente...</div>
        </div>

        <div class="control-panel">
            <div class="switch-container">
                <label class="switch-label"><input type="checkbox" id="mode-aleatoire" checked> 🎲 Aléatoire</label>
                <label class="switch-label"><input type="checkbox" id="mode-auto"> 🔄 Auto</label>
            </div>

            <button id="btn-next-question" class="big-btn start-btn">🚀 LANCER LA PARTIE</button>
        </div>

        <div class="footer-controls">
            <button id="btn-stop-game" class="mini-btn rouge">🛑 PODIUM</button>
            <button id="btn-reset" class="mini-btn gris">🔄 Reset Rapide</button>
            <button id="btn-kick-all" class="mini-btn gris">💀 Kick All</button>
        </div>
    </div>

    <div id="zone-validation" class="overlay-juge">
        <div class="juge-content">
            <h3 class="titre-validation">QUI A BUZZÉ ?</h3>
            <div id="juge-joueur" class="nom-joueur-buzz">JOUEUR</div>
            
            <div class="actions-juge">
                <button id="btn-vrai" class="gros-bouton btn-vert">
                    <span class="emoji">✅</span>
                    <small>VRAI</small>
                </button>
                
                <button id="btn-reveal" class="petit-bouton-gris">
                    <span class="emoji">👀</span><br>RÉPONSE
                </button>

                <button id="btn-faux" class="gros-bouton btn-rouge">
                    <span class="emoji">❌</span>
                    <small>FAUX</small>
                </button>
            </div>
        </div>
    </div>

    <div id="restart-screen">
        <h1 style="color:#f1c40f; font-size: 3rem; margin-bottom: 20px;">PARTIE TERMINÉE</h1>
        <p class="restart-text">Le podium est affiché sur la TV.<br>Prêt pour une nouvelle partie ?</p>
        
        <button id="btn-hard-reset">
            🔄 TOUT EFFACER <br> & RECOMMENCER
        </button>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
