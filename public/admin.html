<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablette Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="control-grid">
        <div style="grid-column: span 2; text-align: center; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px;">
            
            <h3 id="compteur-q" style="color: #f1c40f; margin-bottom: 15px;">
                Questions restantes : -- / --
            </h3>

            <label style="font-size: 1.2rem; cursor: pointer; display: block; margin-bottom: 20px;">
                <input type="checkbox" id="mode-aleatoire" checked> 
                🎲 Mode Aléatoire (Mélanger)
            </label>

            <button id="btn-next-question" class="dash-btn btn-vert" style="width: 100%; font-size: 1.5rem; padding: 20px;">
                🚀 LANCER LA PROCHAINE QUESTION
            </button>

            <p id="preview-q" style="margin-top: 15px; color: #bdc3c7; font-style: italic;">
                Prêt à lancer...
            </p>
        </div>

        <button id="btn-reset" class="dash-btn btn-gris">🔄 Reset Jeu</button>
        <button id="btn-kick-all" class="dash-btn btn-rouge">💀 Virer Joueurs</button>
    </div>

    <div id="zone-validation" class="overlay-juge">
        <div class="juge-content">
            <h2 class="titre-validation">VALIDATION RÉPONSE</h2>
            <div id="juge-joueur" class="nom-joueur-buzz">...</div>
            
            <div class="actions-juge">
                <button id="btn-vrai" class="gros-bouton btn-vert">
                    <span class="emoji">✅</span><br>CORRECT<br><small>(+1 Pt)</small>
                </button>
                <button id="btn-faux" class="gros-bouton btn-rouge">
                    <span class="emoji">❌</span><br>FAUX<br><small>(Continuer)</small>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
